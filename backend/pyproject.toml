[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-operations-platform-backend"
version = "0.1.0"
description = "Backend for the Enterprise Financial Operations Platform"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "Django==6.0.0",
    "djangorestframework==3.16.0",
    "psycopg[binary]==3.2.13",
    "django-cors-headers==4.7.0",
    "django-filter==24.3",
    "drf-spectacular==0.28.0",
    "djangorestframework-simplejwt==5.4.0",
    "django-environ==0.11.2",
    "Pillow==12.3.0",
    "openpyxl==3.1.5",
    "celery==5.4.0",
    "redis==5.2.1",
    "reportlab>=4.0,<6",
    "gunicorn==23.0.0",
    "whitenoise==6.9.0",
    "django-storages[s3]==1.14.4",
    "boto3==1.35.99",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-django==4.10.0",
    "pytest-cov==6.0.0",
    "factory-boy==3.3.1",
    "Faker==37.4.0",
    "black==24.10.0",
    "ruff==0.8.0",
    "isort==6.0.1",
    "mypy==1.14.1",
    "django-stubs==5.0.0",
    "types-requests==2.33.0.20260712",
]
prod = [
    "gunicorn==23.0.0",
]

[tool.black]
line-length = 100
# Python 3.13 is the minimum supported runtime, so formatting targets the
# lowest supported grammar while remaining valid on the preferred 3.14 runtime.
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.venv
  | venv
  | env
  | migrations
  | __pycache__
  | \.git
  | \.pytest_cache
  | \.mypy_cache
  | htmlcov
  | dist
  | build
  | node_modules
  | \.next
  | coverage
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["migrations", ".venv", "venv", "env", "__pycache__", ".git"]

[tool.ruff]
line-length = 100
# Lint against the minimum supported Python grammar. Both Python 3.13 and
# the preferred Python 3.14 production runtime must pass the runtime matrix.
target-version = "py313"
exclude = [
    "migrations",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    "htmlcov",
    "dist",
    "build",
    "node_modules",
    ".next",
    "coverage",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
show_error_codes = true

# Ignore known Django/mypy compatibility issues
disable_error_code = [
    "var-annotated",    # Django model fields don't have type annotations
    "assignment",       # UserManager assignment
    "has-type",         # Manager type issues
    "attr-defined",     # Manager create_user/create_superuser
    "index",            # Settings dict indexing
]

[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rest_framework.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django.db.models.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django.contrib.auth.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apps.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "config.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "corsheaders.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django_filters.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "drf_spectacular.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django_stubs.*"
ignore_missing_imports = true
