[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --ds=config.settings.test
    --create-db
    --strict-markers
    --strict-config
    -v
testpaths = apps
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
