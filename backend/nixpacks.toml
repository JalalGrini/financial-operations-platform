# Nixpacks config. Railway service Root Directory must be `backend`
# so Nixpacks finds ./requirements.txt in this directory.
providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.13"
DJANGO_SETTINGS_MODULE = "config.settings.production"

[start]
cmd = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
