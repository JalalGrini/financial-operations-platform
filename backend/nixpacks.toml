# Fallback if the Railway service builder is Nixpacks instead of Railpack.
# Root Directory must still be `backend`.
providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.14"
DJANGO_SETTINGS_MODULE = "config.settings.production"

[phases.install]
cmds = ["python -m pip install -r requirements.txt"]

[start]
cmd = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
