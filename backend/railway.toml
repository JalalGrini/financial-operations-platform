# Railway config for the Django API.
#
# Dashboard (required): Service → Settings → Root Directory = backend
# Config-as-code path (required for this file to apply): /backend/railway.toml
# Railway does not look in the Root Directory for railway.toml by default.
#
# Do not put a second railway.toml at the monorepo root — that would confuse a
# later frontend service. This file is the backend service source of truth.
#
# Env vars are NOT stored here (no secrets). Set them in the Railway dashboard.
# Production settings refuse to boot without:
#   DJANGO_SECRET_KEY (>= 50 chars, no placeholder)
#   DJANGO_DEBUG=False
#   REDIS_URL
#   USE_S3_STORAGE=True plus R2_* credentials
# Postgres: Railway's plugin injects DATABASE_URL (preferred). POSTGRES_* still
# works for docker-compose / manual hosts.

[build]
builder = "NIXPACKS"

[deploy]
# wsgi.py already defaults DJANGO_SETTINGS_MODULE to config.settings.production
# One worker: Django 6 + Python 3.13 on Railway starter RAM OOMs with 2.
# Healthcheck Host is healthcheck.railway.app (ALLOWED_HOSTS must include it).
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
preDeployCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
healthcheckPath = "/api/v1/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
