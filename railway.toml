# Railway config-as-code (repository root).
#
# Dashboard: Service → Settings → Root Directory = backend
# so Nixpacks sees backend/requirements.txt and backend/manage.py.
# This file is loaded from the git root (set railwayConfigFile = railway.toml).

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
preDeployCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py createsuperuser --noinput || true"
healthcheckPath = "/api/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
