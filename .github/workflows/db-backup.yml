# Required GitHub repository secrets for this workflow:
# - RAILWAY_BACKEND_URL
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY
# - AWS_S3_ENDPOINT_URL
# - DATABASE_URL
# Also required to boot Django production settings:
# - DJANGO_SECRET_KEY
# - REDIS_URL
# - R2_BUCKET_NAME
# - R2_ACCOUNT_ID
# - DJANGO_ALLOWED_HOSTS
#
# backup dumps Postgres via DATABASE_URL and uploads to R2.
# cleanup_ticket_files deletes public ticket attachments older than 30 days.
# Neither job HTTP-calls RAILWAY_BACKEND_URL.

name: Daily database backup

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  DJANGO_SETTINGS_MODULE: config.settings.production
  DJANGO_ENVIRONMENT: production
  RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
  REDIS_URL: ${{ secrets.REDIS_URL }}
  R2_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  R2_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
  USE_S3_STORAGE: "True"

jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y postgresql-client libmagic1
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Backup database to R2
        run: python manage.py backup_db

  cleanup_ticket_files:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * *'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Delete ticket attachments older than 30 days
        run: python manage.py cleanup_ticket_files
